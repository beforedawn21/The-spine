<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Spine</title>
    <meta name="description" content="The Spine - the operating system for human value. Ask any AI, create anything, and earn when it works." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <meta property="og:title" content="The Spine" />
    <meta property="og:description" content="Ask anything. Any answer can become a picture, a song, or a voice." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thespine.cloud" />
    <!-- THE SHARE CARD. This file existed for months with nothing pointing at it, so every
         link anyone sent - a text, a Slack message, a tweet - arrived as a bare URL with no
         picture. The URL must be absolute: a relative path is ignored by every platform,
         because their crawlers do not know what site they are on. PNG rather than SVG,
         because Facebook, LinkedIn and iMessage refuse to render SVG previews. -->
    <meta property="og:image" content="https://thespine.cloud/og-image.png?v=4" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="THE SPINE - ask anything. Any answer can become a picture, a song, or a voice." />
    <meta property="og:site_name" content="The Spine" />
    <!-- Without this, Twitter and iMessage show a small thumbnail instead of the full card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Spine" />
    <meta name="twitter:description" content="Ask anything. Any answer can become a picture, a song, or a voice." />
    <meta name="twitter:image" content="https://thespine.cloud/og-image.png?v=4" />
    <meta name="theme-color" content="#0B1019" />
    <!-- Without this the browser paints white scrollbars, white form controls and a white
         overscroll area behind a dark page. -->
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="The Spine" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg?v=4" />
    <link rel="mask-icon" href="/favicon.svg?v=4" color="#B8935A" />
    <script>
      /* THE FLASH. React decides the theme, but the browser has already painted by then - so a
         navy app opened with a white blink every single time. This reads the same key React
         reads, before anything renders, and paints accordingly. Navy unless they asked for
         light. It is deliberately tiny and deliberately first. */
      (function(){
        try{
          var s = localStorage.getItem("spine.dark");
          var dark = (s === null) ? true : (s !== "0");
          document.documentElement.style.background = dark ? "#0B1019" : "#F7F4EF";
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          if(dark) document.documentElement.classList.add("pre-dark");
        }catch(e){
          document.documentElement.style.background = "#0B1019";
        }
      })();
    </script>
      <link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
